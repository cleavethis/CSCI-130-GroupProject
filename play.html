<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Wordle Clone</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <h1 class="welcome">Let's Play Wordle Clone!</h1>
        <button id="toggleModeButton">Toggle Light/Dark Mode</button>
    </div>
    <div id="container">
        <div class="game-wrapper">
            <div class="game-board">
                <!-- Game board will be generated here -->
            </div>
            <div class="keyboard">
                <!-- On-screen keyboard will be generated here -->
            </div>
        </div>
    </div>

    <!-- Script to toggle light/dark mode -->
    <script src="code.js"></script>
</body>
</html>
